<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">

    <title>Great Coffee</title>

</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="assets/logo-icon.svg" alt="Ícone de um copo de café verde">
        </div>

        <!-- Navegação Desktop (Oculta no Mobile) -->
        <nav class="nav-desktop">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="recompensas.html">Recompensa</a></li>
                <li><a href="cartoes.html">Gift Cards</a></li>
                <li><a href="lojas.html">Lojas</a></li>
            </ul>
        </nav>

        <!-- Botão do cabeçalho (Oculto no Mobile) para o menu -->
        <a href="menu.html" class="btn-outline btn-desktop">Pegar seu café</a>

        <!-- Ícone do Menu Mobile (Oculto no Desktop) -->
        <button class="menu-mobile" aria-label="Abrir menu">
            <img src="assets/menu-hamburguer.svg" alt="Menu">
        </button>

    </header>

    <main>
        
        <section class="hero">
            
            <!-- Texto e botão exclusivos da versão Mobile -->
            <div class="conteudo-mobile">
                <p>O Café que fará seu código decolar para o próximo nível.</p>
                <!-- Botão mobile direcionando para o menu -->
                <a href="menu.html" class="btn-outline">Pegar seu café</a>
            </div>

            <h1 class="titulo-principal">
                Great Coffee <br>
                <span class="texto-verde">&lt;/Great Code/&gt;</span>
            </h1>

            <div class="imagem-destaque">
                <img src="assets/copos-cafe.png" alt="Dois copos de café 3D com tampa preta">
            </div>

        </section>

    </main>

</body>

</html>
